name: backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "evaluation/**"
      - "requirements*.txt"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - "evaluation/**"
      - "requirements*.txt"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check emergency gate parity
        run: python -m tests.test_gate_parity

      - name: Run pytest test suite
        run: pytest -v
